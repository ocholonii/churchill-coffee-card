:root{
  /* exact menu values (Figma "Churchill Menu" variables) */
  --blue-deep:#1f5fc4; --blue-mid:#4a8fd8; --blue-pale:#a8c7e8; --blue-mist:#edf3f7; --white:#ffffff;
  --title-blue:#3e6b93; --rule-blue:#4a779f; --desc-navy:#2a466f; --badge-orange:#db7435; --shadow-blue:#5889b9;
  /* Figma stops 0/20/42/60/70% sit on a gradient scaled 1.097x and shifted 2.8%, so on the page they land at: */
  --menu-grad:linear-gradient(180deg,var(--blue-deep) -2.6%,var(--blue-mid) 15.7%,var(--blue-pale) 35.7%,var(--blue-mist) 52.1%,var(--white) 61.3%,var(--white) 100%);
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--white);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--menu-grad);background-repeat:no-repeat;color:var(--desc-navy);
  font:400 13px/1.25 "Geist Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:max(48px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:350px;display:flex;flex-direction:column;align-items:center;gap:78px}
/* empty 294 x 87 frame at the top of Joyce's Card column ("Frame 1", 10:162): kept as spacing */
.spacer{width:294px;max-width:100%;height:87px}

/* logo: white wordmark straight on the blue, no tag */
.logo{display:block;width:200px}
.logo svg{display:block;width:100%;height:auto}


.actions{display:flex;flex-direction:column;align-items:center;gap:11px}
/* tagline: Geist Mono Medium 11, caps, 2% tracking, desc navy with a 5px round white outside stroke (die-cut, as Joyce set it) */
.tagline{font-weight:500;font-size:11px;line-height:1.25;letter-spacing:.02em;text-transform:uppercase;text-align:center;color:var(--desc-navy);
  text-shadow:5.00px 0.00px 0 var(--white),4.83px 1.29px 0 var(--white),4.33px 2.50px 0 var(--white),3.54px 3.54px 0 var(--white),2.50px 4.33px 0 var(--white),1.29px 4.83px 0 var(--white),0.00px 5.00px 0 var(--white),-1.29px 4.83px 0 var(--white),-2.50px 4.33px 0 var(--white),-3.54px 3.54px 0 var(--white),-4.33px 2.50px 0 var(--white),-4.83px 1.29px 0 var(--white),-5.00px 0.00px 0 var(--white),-4.83px -1.29px 0 var(--white),-4.33px -2.50px 0 var(--white),-3.54px -3.54px 0 var(--white),-2.50px -4.33px 0 var(--white),-1.29px -4.83px 0 var(--white),-0.00px -5.00px 0 var(--white),1.29px -4.83px 0 var(--white),2.50px -4.33px 0 var(--white),3.54px -3.54px 0 var(--white),4.33px -2.50px 0 var(--white),4.83px -1.29px 0 var(--white)}
/* the 5 px round-joined white outline is drawn as a ring of text-shadows: CSS text-stroke would give mitred spikes */
.pill{display:flex;align-items:center;justify-content:center;gap:6px;width:200px;height:30px;border-radius:5px;
  font-weight:700;font-size:14px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:transform .15s var(--ease),opacity .15s var(--ease)}
.pill svg{width:12px;height:12px;flex:none}
.pill.solid{background:var(--blue-deep);color:var(--white)}
@media (hover:hover){.pill:hover{opacity:.9}}
.pill:active{transform:scale(.98)}
.pill:focus-visible{outline:2px solid var(--blue-deep);outline-offset:3px}

.about{width:240px;display:flex;flex-direction:column;gap:10px}
.rule{height:1.8px;background:var(--rule-blue)}
.about p{text-align:justify;text-transform:uppercase;letter-spacing:.02em;hyphens:none;color:var(--desc-navy)}
.about .ref{text-align:right;font-weight:500;font-size:12px;line-height:1.15;text-transform:uppercase;letter-spacing:.04em;color:var(--rule-blue)}

.in{opacity:0;animation:rise .8s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

/* ---- printed square card, 3D flip + tilt. Hidden, as in the current Figma layout: remove the "hidden" attribute on #pc-wrap to show it. ---- */
.pc-wrap{display:flex;flex-direction:column;align-items:center}
.pc-wrap[hidden]{display:none}
.pc-stage{width:min(260px,72vw);aspect-ratio:1/1;perspective:1100px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.pc{--rx:0deg;--ry:0deg;display:block;position:relative;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry))}
.pc-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s ease}
.pc.is-flipped .pc-inner{transform:rotateY(180deg)}
.pc-face{position:absolute;inset:0;border-radius:3px;overflow:hidden;background:var(--blue-deep);-webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 0 0 1px rgba(74,119,159,.25),0 14px 28px -4px rgba(88,137,185,.45),0 2px 3px rgba(0,0,0,.25)}
.pc-face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pc-back{transform:rotateY(180deg)}
@media (min-width:600px){.pc-stage{width:290px}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none}.pill{transition:none}.pc{transform:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="pc-wrap" id="pc-wrap" hidden>
    <div class="pc-stage">

(function(){var pc=document.getElementById('pc'),w=document.getElementById('pc-wrap');if(!pc||w.hidden)return;
pc.addEventListener('click',function(){pc.classList.toggle('is-flipped')});
pc.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse'||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var r=pc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*2-1,y=(e.clientY-r.top)/r.height*2-1;pc.style.setProperty('--ry',(x*12).toFixed(1)+'deg');pc.style.setProperty('--rx',(-y*12).toFixed(1)+'deg')});
pc.addEventListener('pointerleave',function(){pc.style.setProperty('--ry','0deg');pc.style.setProperty('--rx','0deg')});})();
</script>
</body>
</html>
